# First-time setup only. To update the live site without downtime, run ./deploy.sh,
# which uses the same settings.
services:
  ayesha:
    build: .
    image: ayesha-ayesha
    container_name: ayesha-gift
    network_mode: host
    env_file: .env
    environment:
      HOST: "::"
      PORT: 8081
      DATABASE_PATH: /app/data/ayesha.sqlite
    volumes:
      - ./data:/app/data
    restart: unless-stopped
