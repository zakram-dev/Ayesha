<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayesha quote admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main>
      <header class="admin-header">
        <div>
          <p class="eyebrow">private owner area</p>
          <h1>Quote management</h1>
        </div>
        <button class="button secondary" id="logout" type="button" hidden>Log out</button>
      </header>

      <section class="panel login-panel" id="login-panel">
        <h2>Sign in</h2>
        <p>Use the admin password configured on your server.</p>
        <form id="login-form">
          <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
          <button class="button" type="submit">Sign in</button>
        </form>
      </section>

      <div id="admin-content" hidden>
        <p class="status" id="status" role="status"></p>
        <section class="stats-grid">
          <div class="stat-card"><strong id="stat-quotes">0</strong><span>total quotes</span></div>
          <div class="stat-card"><strong id="stat-active-quotes">0</strong><span>active quotes</span></div>
          <div class="stat-card"><strong id="stat-categories">0</strong><span>categories</span></div>
          <div class="stat-card"><strong id="stat-active-categories">0</strong><span>active categories</span></div>
        </section>
        <section class="panel">
          <div class="section-header"><h2>Main quote popup</h2></div>
          <form class="settings-form" id="settings-form">
            <label class="checkbox"><input id="popup-enabled" type="checkbox" /> Show popup on public page</label>
            <label>Delay (milliseconds) <input id="popup-delay" type="number" min="0" max="60000" step="100" required /></label>
            <label>Show frequency
              <select id="popup-frequency">
                <option value="session">Once per browser session</option>
                <option value="day">Once per day</option>
                <option value="always">Every page load</option>
              </select>
            </label>
            <button class="button" type="submit">Save popup settings</button>
          </form>
        </section>
        <section class="panel">
          <div class="section-header"><h2>Add a quote</h2></div>
          <form class="quote-form" id="quote-form">
            <label class="wide">Quote <textarea id="quote-text" maxlength="2000" required></textarea></label>
            <label>Category <select id="quote-category" required></select></label>
            <label>Author <input id="quote-author" maxlength="120" /></label>
            <label>Display order <input id="quote-order" type="number" value="0" /></label>
            <label class="checkbox"><input id="quote-active" type="checkbox" checked /> Active</label>
            <label class="checkbox"><input id="quote-main" type="checkbox" /> Make main quote</label>
            <button class="button" id="quote-submit" type="submit">Add quote</button>
            <button class="button secondary" id="quote-cancel" type="button" hidden>Cancel edit</button>
          </form>
        </section>

        <section class="panel">
          <div class="section-header"><h2>Quotes</h2><input id="quote-search" placeholder="Search quotes" /></div>
          <div class="table-wrap"><table><thead><tr><th>Quote</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody id="quotes"></tbody></table></div>
        </section>

        <section class="panel">
          <div class="section-header"><h2>Categories</h2></div>
          <form class="category-form" id="category-form">
            <input id="category-name" placeholder="Name" maxlength="80" required />
            <input id="category-slug" placeholder="slug" maxlength="80" required />
            <input id="category-card-title" placeholder="Public card title" maxlength="120" required />
            <input id="category-description" placeholder="Description" maxlength="300" />
            <input id="category-color" placeholder="Color name" maxlength="40" />
            <button class="button" id="category-submit" type="submit">Add category</button>
            <button class="button secondary" id="category-cancel" type="button" hidden>Cancel edit</button>
          </form>
          <div class="table-wrap"><table><thead><tr><th>Name</th><th>Slug</th><th>Quotes</th><th>Status</th><th>Actions</th></tr></thead><tbody id="categories"></tbody></table></div>
        </section>
      </div>
    </main>
    <script src="/admin/admin.js"></script>
  </body>
</html>
